name: Format
on:
  workflow_call:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Codebase
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "18.x"

      - name: Install Dependencies
        run: npm install --save-dev --silent prettier@3.1.0

      - name: Run Prettier
        run: npx prettier . --check
